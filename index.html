function getUsage(){try{const r=localStorage.getItem("clr_usage");if(!r)return 0;return parseInt(r)||0;}catch(_){return 0;}}
function incrementUsage(){const count=getUsage()+1;try{localStorage.setItem("clr_usage",String(count));}catch(_){}return count;}
function todayUsage(){return getUsage();}
function getAgeGateAccepted(){try{return localStorage.getItem("clr_age")==="1";}catch(_){return false;}}
function getToSAccepted(){try{return localStorage.getItem("clr_tos")==="1";}catch(_){return false;}}
function isAdminMode(){try{return localStorage.getItem("clr_admin")==="1";}catch(_){return false;}}

async function hashPassword(password){
  const msgBuffer=new TextEncoder().encode(password);
  const hashBuffer=await crypto.subtle.digest("SHA-256",msgBuffer);
  const hashArray=Array.from(new Uint8Array(hashBuffer));
  return hashArray.map(b=>b.toString(16).padStart(2,"0")).join("");
}

async function submitToGoogle(name,email){
  const formData=new FormData();
  formData.append(ENTRY_NAME,name);
  formData.append(ENTRY_EMAIL,email);
  await fetch(GOOGLE_FORM_URL,{method:"POST",mode:"no-cors",body:formData});
}

const CONTEXTS=[
  {id:"work",  label:"Work",  sub:"meetings, slack, feedback", tone:"Professional, direct, solution-focused. Remove blame and emotion."},
  {id:"dating",label:"Dating",sub:"texts, dates, crushes",     tone:"Warm and genuine. Natural, not desperate. Remove try-hard energy."},
  {id:"social",label:"Social",sub:"friends, in-person chats",  tone:"Conversational, relaxed, human. Short enough to say aloud."},
  {id:"email", label:"Email", sub:"professional messages",     tone:"Polished, one clear ask, no fluff. Professional but not cold."},

const ARCHETYPES={
  "over-explainer":{key:"over-explainer",label:"The Over-Sharer",emoji:"📖",color:"#9B8EC4",
    tagline:"You lead with empathy, context, and about 40% too many words.",
    traits:["Empathetic","Thorough","Verbose"],
    tip:"Write it all out, then delete the first two sentences.",
    exitStyle:"Give a detailed story-based excuse with names and context. Example: Oh my god, I just got a text — my friend Maya is locked out of her flat and I am literally the only one with a spare key. I am so sorry, I have to run!"},
  terse:{key:"terse",label:"The Clammer",emoji:"🔒",color:"#7B82B8",
    tagline:"Under pressure you go quiet. What comes out is curt and often misread.",
    traits:["Efficient","Private","Guarded"],
    tip:"Add one warm sentence before your main point.",
    exitStyle:"Give the shortest possible exit. One sentence, no explanation. Example: I have to go. Or: Sorry, something came up."},
  qualifier:{key:"qualifier",label:"The Softener",emoji:"🌿",color:"#8B82B8",
    tagline:"You wrap every thought in cushions. The point is in there — somewhere.",
    traits:["Considerate","Diplomatic","Hedging"],
    tip:"Lead with the ask. Soften after.",
    exitStyle:"Give a warm apologetic excuse loaded with softeners. Example: I am so sorry, I really hate to do this, but I just remembered I promised to help someone — would you mind if I slipped away?"},
  blunt:{key:"blunt",label:"The Steamroller",emoji:"⚡",color:"#6E65A0",
    tagline:"You say exactly what you mean — sometimes before checking the moment.",
    traits:["Direct","Decisive","Unfiltered"],
    tip:"Add one line of context before you land the point.",
    exitStyle:"Give a direct unapologetic exit. No story needed. Example: I need to head off. Or: I am going to go now. Delivered with confidence."},
};

const QUIZ=[
  {field:"communicationStyle",q:"When you're stressed, your messages tend to be…",opts:[
    {val:"over-explainer",text:"Long. I explain everything, add context, then add more context."},
    {val:"terse",         text:"Short. Too short. People think I'm annoyed when I'm just stressed."},
    {val:"qualifier",     text:"Full of 'maybe', 'I think', 'just wondering if' — the point gets buried."},
    {val:"blunt",         text:"Direct. Sometimes uncomfortably so."},
  ]},
  {field:"toneDefault",q:"In professional settings, you're usually…",opts:[
    {val:"warm-casual",text:"Warm and friendly — probably too casual for the room."},
    {val:"formal",     text:"Formal and stiff — it can feel impersonal."},
    {val:"passive",    text:"Passive. I hedge a lot."},
    {val:"direct",     text:"Confident — occasionally comes across as blunt."},
  ]},
  {field:"mainTrigger",q:"You're most likely to spiral when…",opts:[
    {val:"conflict",  text:"There's conflict, tension, or I need to give hard feedback."},
    {val:"romantic",  text:"It's romantic or social — stakes feel personal."},
    {val:"authority", text:"I'm talking to someone with power over me."},
    {val:"group",     text:"I'm in a group and feel like I'll be judged."},
  ]},

    {val:"overshared",  text:"Immediate regret. Did I say too much?"},
    {val:"underplayed", text:"Worry. Was that too cold or short?"},
    {val:"ruminator",   text:"Fine — until I re-read it three times later."},
    {val:"pre-worry",   text:"Okay. The before is harder than the after."},
  ]},
  {field:"helpGoal",q:"What do you actually want help with?",opts:[

  ]},
];

function buildPersonality(ans){
  const arch=ARCHETYPES[ans.communicationStyle]||ARCHETYPES.qualifier;
  const tM={"warm-casual":"warm & casual",formal:"formal/stiff",passive:"passive/hedging",direct:"confident & direct"};
  const tgM={conflict:"conflict & feedback",romantic:"romantic situations",authority:"authority figures",group:"group settings"};
  const gM={brevity:"saying less",warmth:"adding warmth",confidence:"sounding confident",tone:"matching tone"};
  const aM={overshared:"oversharing",underplayed:"being too cold",ruminator:"re-reading obsessively","pre-worry":"anticipation"};
  const summary=[
    `Archetype: "${arch.label}" — ${arch.tagline}`,
    `Under stress: ${ans.communicationStyle?.replace("-"," ")}.`,
    `Default tone: ${tM[ans.toneDefault]||ans.toneDefault}.`,
    `Overthinks in: ${tgM[ans.mainTrigger]||ans.mainTrigger}.`,
    `After-send fear: ${aM[ans.afterSendFeeling]||ans.afterSendFeeling}.`,
    `Goal: ${gM[ans.helpGoal]||ans.helpGoal}.`,
    `Tip: ${arch.tip}`,
    `Exit style: ${arch.exitStyle}`,
  ].join(" ");
  return{...ans,archetypeKey:arch.key,archetypeLabel:arch.label,archetypeTagline:arch.tagline,aiPromptSummary:summary,completed:true};
}

const defaultP={communicationStyle:null,toneDefault:null,mainTrigger:null,afterSendFeeling:null,helpGoal:null,archetypeKey:null,completed:false,aiPromptSummary:null};

const AC=createContext(null);
const useApp=()=>useContext(AC);

function AppProvider({children}){
  const [screen,      setScreen]      = useState("gate");
  const [personality, setPersonality] = useState(defaultP);
  const [ctx,         setCtx]         = useState(CONTEXTS[0]);
  const [raw,         setRaw]         = useState("");
  const [result,      setResult]      = useState(null);
  const [loading,     setLoading]     = useState(false);
  const [genError,    setGenError]    = useState(null);
  const [history,     setHistory]     = useState([]);
  const [usageCount,  setUsageCount]  = useState(()=>todayUsage());
  const [showPaywall, setShowPaywall] = useState(false);

  useEffect(()=>{
    try{
      const ageOk=getAgeGateAccepted();
      const tosOk=getToSAccepted();
      if(ageOk&&tosOk){
        const p=localStorage.getItem("clr_p");
        if(p){const j=JSON.parse(p);if(j?.completed){setPersonality(j);setScreen("main");return;}}
        setScreen("splash");
      }
      const h=localStorage.getItem("clr_h");
      if(h)setHistory(JSON.parse(h)||[]);
    }catch(_){}
  },[]);

  const go=useCallback((to)=>setScreen(to),[]);

  const completeOnboarding=useCallback((ans)=>{
    const full=buildPersonality(ans);
    setPersonality(full);
    try{localStorage.setItem("clr_p",JSON.stringify(full));}catch(_){}
    setScreen("reveal");
  },[]);

  const generate=useCallback(async(currentRaw,currentCtx,currentPersonality)=>{
    if(!currentRaw.trim())return;
    const used=todayUsage();
    if(used>=FREE_LIMIT&&!isAdminMode()){setShowPaywall(true);return;}
    setResult(null);setGenError(null);setLoading(true);setScreen("output");
    try{
      const arch=ARCHETYPES[currentPersonality.archetypeKey]||ARCHETYPES.qualifier;
      const systemPrompt=[
        "You are Clearly — a warm, witty communication filter for overthinkers. Help people say what they mean clearly and confidently.",
        "",
        `USER PERSONALITY: ${currentPersonality.aiPromptSummary||"General overthinker."}`,
        `ARCHETYPE: ${arch.label} — ${arch.exitStyle}`,
        "",
        `CONTEXT: ${currentCtx.label} — ${currentCtx.tone}`,
        "",
        "LANGUAGE: Detect input language carefully. English input → English output. Hinglish input (yaar, bhai, kya, matlab, nahi, haan, arre, woh) → Hinglish output matching young urban Indian texting style. Hindi Devanagari → Hindi. Never switch unless user switches.",
        "",
        "EXIT DETECTION: If message involves physical discomfort, socially impossible situations, workplace landmines, family traps, bad dates, unwanted flirting, digital text traps — set isExit true and give 3 exit excuses matching user personality. Max 2 sentences each.",
        "",
        "IF NORMAL REWRITE: set isExit false. Give 3 rewrites. Fix their weakness: over-explaining → cut ruthlessly, terse → add warmth, hedging → be direct, blunt → soften. Each variation meaningfully different in tone and length. Keep SHORT and punchy. Never robotic or LinkedIn-ish.",
        "",
        "RESPOND WITH ONLY RAW JSON. No markdown. No code fences:",
        '{"isExit":false,"variations":[{"refined":"text","explanation":"one line"},{"refined":"text","explanation":"one line"},{"refined":"text","explanation":"one line"}]}',
      ].join("\n");

      const res=await fetch("https://clearly-proxy.ansh4all.workers.dev",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
          model:MODEL,
          messages:[{role:"system",content:systemPrompt},{role:"user",content:currentRaw}],
          max_tokens:5000,temperature:0.9,
        }),
      });
      const data=await res.json();
      if(data.error)throw new Error(data.error.message||"Groq API error");
      const text=data.choices?.[0]?.message?.content||"";
      if(!text)throw new Error("Empty response");
      let clean=text.replace(/```json|```/g,"").trim();
      let parsed;
      try{parsed=JSON.parse(clean);}
      catch(e){
        const matches=[...clean.matchAll(/\{"refined"\s*:\s*"((?:[^"\\]|\\.)*)"\s*,\s*"explanation"\s*:\s*"((?:[^"\\]|\\.)*)"\s*\}/g)];
        if(matches.length>0){
          parsed={isExit:clean.includes('"isExit":true'),variations:matches.map(m=>({refined:m[1],explanation:m[2]}))};
        }else{throw new Error("Clearly is taking a breather — try again in a moment.");}
      }
      const variations=parsed.variations||[parsed];
      const isExit=parsed.isExit||false;
      const newCount=isAdminMode()?getUsage():incrementUsage();
      setUsageCount(newCount);
      setResult({variations,currentIndex:0,isExit,...variations[0]});
      setHistory(h=>{
        const entry={id:Date.now(),ctx:currentCtx,raw:currentRaw,refined:variations[0].refined,isExit,ts:new Date().toISOString()};
        const u=[entry,...h].slice(0,30);
        try{localStorage.setItem("clr_h",JSON.stringify(u));}catch(_){}
        return u;
      });
    }catch(e){
      setGenError("Clearly is taking a breather — try again in a moment.");
    }finally{setLoading(false);}
  },[]);

  const reset=useCallback(()=>{
    setPersonality(defaultP);setResult(null);setRaw("");setGenError(null);
    try{localStorage.removeItem("clr_p");}catch(_){}
    setScreen("splash");
  },[]);

  return(
    <AC.Provider value={{screen,go,personality,completeOnboarding,reset,ctx,setCtx,raw,setRaw,result,setResult,loading,genError,generate,history,usageCount,showPaywall,setShowPaywall}}>
      {children}
    </AC.Provider>
  );
}

function PBtn({children,onClick,disabled,style={}}){
  const [h,setH]=useState(false);
  return <button onClick={onClick} disabled={disabled} onMouseEnter={()=>setH(true)} onMouseLeave={()=>setH(false)}
    style={{background:disabled?D.surf2:h?D.accentD:D.accent,color:disabled?D.cream3:"#fff",border:"none",borderRadius:14,padding:"16px 28px",fontFamily:D.sans,fontSize:15,fontWeight:500,cursor:disabled?"not-allowed":"pointer",transition:"all .2s",...style}}>
    {children}
  </button>;
}

function GBtn({children,onClick,style={}}){
  const [h,setH]=useState(false);
  return <button onClick={onClick} onMouseEnter={()=>setH(true)} onMouseLeave={()=>setH(false)}
    style={{background:h?D.surf2:"transparent",color:D.cream2,border:`1px solid ${D.border}`,borderRadius:10,padding:"11px 20px",fontFamily:D.sans,fontSize:13,cursor:"pointer",transition:"all .2s",...style}}>
    {children}
  </button>;
}

function NameEmailForm({onSubmit,submitting,inputBg=D.surface}){
  const [name,setName]=useState("");
  const [email,setEmail]=useState("");
  const valid=name.trim()&&email.includes("@");
  return(
    <div style={{width:"100%"}}>
      <input type="text" value={name} onChange={e=>setName(e.target.value)}
        placeholder="Your name"

      />
      <input type="email" value={email} onChange={e=>setEmail(e.target.value)}
        placeholder="your@email.com"
        onKeyDown={e=>e.key==="Enter"&&valid&&onSubmit(name,email)}
        style={{width:"100%",background:inputBg,border:`1px solid ${D.border}`,borderRadius:10,padding:"12px 16px",fontFamily:D.sans,fontSize:14,color:D.cream,outline:"none",marginBottom:10}}
      />
      <PBtn onClick={()=>valid&&onSubmit(name,email)} disabled={!valid||submitting} style={{width:"100%"}}>
        {submitting?"Sending…":"Count me in →"}
      </PBtn>
    </div>
  );
}

function AdminLogin({onClose}){
  const [password,setPassword]=useState("");
  const [error,setError]=useState("");
  const [attempts,setAttempts]=useState(0);
  const [v,setV]=useState(false);
  useEffect(()=>{setTimeout(()=>setV(true),50);},[]);
  const handleSubmit=async()=>{
    if(!password.trim())return;
    const hash=await hashPassword(password);
    if(hash===ADMIN_HASH){
      try{localStorage.setItem("clr_admin","1");}catch(_){}
      onClose(true);
    }else{
      const newAttempts=attempts+1;
      setAttempts(newAttempts);
      if(newAttempts>=3){
        setError("Too many attempts.");
        setTimeout(()=>onClose(false),1500);
      }else{
        setError(`Incorrect. ${3-newAttempts} attempt${3-newAttempts!==1?"s":""} left.`);
        setPassword("");
      }
    }
  };
  return(
    <div style={{position:"fixed",inset:0,zIndex:200,background:"rgba(0,0,0,0.92)",display:"flex",alignItems:"center",justifyContent:"center",padding:24}}>
      <div style={{background:D.surface,border:`1px solid ${D.border}`,borderRadius:20,padding:28,maxWidth:300,width:"100%",textAlign:"center",opacity:v?1:0,transform:v?"translateY(0)":"translateY(16px)",transition:"all .3s ease"}}>
        <p style={{fontFamily:D.sans,fontSize:10,color:D.cream3,textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:16}}>Admin access</p>
        <input
          type="password"
          value={password}
          onChange={e=>setPassword(e.target.value)}
          onKeyDown={e=>e.key==="Enter"&&handleSubmit()}
          placeholder="Password"
          autoFocus
          style={{width:"100%",background:D.bg,border:`1px solid ${D.border}`,borderRadius:10,padding:"12px 16px",fontFamily:D.sans,fontSize:14,color:D.cream,outline:"none",marginBottom:10}}
        />
        {error&&<p style={{fontFamily:D.sans,fontSize:12,color:"#E08080",marginBottom:10}}>{error}</p>}
        <div style={{display:"flex",gap:8}}>
          <PBtn onClick={handleSubmit} style={{flex:1,padding:"12px"}}>Enter</PBtn>
          <GBtn onClick={()=>onClose(false)} style={{flex:1,padding:"12px"}}>Cancel</GBtn>
        </div>
      </div>
    </div>
  );
}

function Quiz(){
  const {completeOnboarding}=useApp();
  const [step,setStep]=useState(0);
  const [answers,setAnswers]=useState({});
  const [sel,setSel]=useState(null);
  const [animIn,setAnimIn]=useState(true);
  const [dir,setDir]=useState(1);
  const total=QUIZ.length;
  const current=QUIZ[step];
  const anim=(d,cb)=>{setAnimIn(false);setDir(d);setTimeout(()=>{cb();setAnimIn(true);},240);};
  const choose=(val)=>{
    setSel(val);
    setTimeout(()=>{
      const a={...answers,[current.field]:val};
      setAnswers(a);
      if(step<total-1){anim(1,()=>{setStep(s=>s+1);setSel(null);});}
      else{completeOnboarding(a);}
    },400);
  };
  const back=()=>{if(!step)return;anim(-1,()=>{const p=step-1;setStep(p);setSel(answers[QUIZ[p].field]||null);});};
  const slide={opacity:animIn?1:0,transform:animIn?"translateX(0)":`translateX(${dir*20}px)`,transition:"opacity .24s ease,transform .24s ease"};
  return(
    <div style={{display:"flex",flexDirection:"column",height:"100%",position:"relative"}}>
      <div style={{position:"relative",zIndex:1,padding:"28px 28px 0",flexShrink:0}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12}}>
          <button onClick={back} style={{background:"none",border:"none",color:step===0?"transparent":D.cream2,cursor:step===0?"default":"pointer",fontFamily:D.sans,fontSize:13,padding:0,transition:"color .2s"}}>← back</button>
          <span style={{fontFamily:D.sans,fontSize:12,color:D.cream3,letterSpacing:"0.04em"}}>{step+1} / {total}</span>
        </div>
        <div style={{height:2,background:D.border,borderRadius:2,overflow:"hidden"}}>
          <div style={{height:"100%",width:`${((step+1)/total)*100}%`,background:D.accent,borderRadius:2,transition:"width .4s ease"}}/>
        </div>
      </div>
      <div style={{flex:1,display:"flex",flexDirection:"column",justifyContent:"center",padding:"32px 28px 28px",position:"relative",zIndex:1}}>
        <div style={slide}>
          <p style={{fontFamily:D.serif,fontSize:26,fontWeight:300,color:D.cream,lineHeight:1.4,marginBottom:32,letterSpacing:"-0.01em"}}>{current.q}</p>
          <div style={{display:"flex",flexDirection:"column",gap:10}}>
            {current.opts.map(opt=>{
              const on=sel===opt.val;
              return(
                <div key={opt.val} onClick={()=>choose(opt.val)}
                  style={{padding:"15px 18px",background:on?`${D.accent}1A`:D.surface,border:`1px solid ${on?D.accent:D.border}`,borderRadius:14,cursor:"pointer",transition:"all .18s",display:"flex",alignItems:"center",gap:14}}>
                  <div style={{width:18,height:18,borderRadius:"50%",border:`1.5px solid ${on?D.accent:D.cream3}`,background:on?D.accent:"transparent",flexShrink:0,transition:"all .18s",display:"flex",alignItems:"center",justifyContent:"center"}}>
                    {on&&<div style={{width:6,height:6,borderRadius:"50%",background:"#fff"}}/>}
                  </div>
                  <span style={{fontFamily:D.sans,fontSize:14,color:on?D.cream:D.cream2,lineHeight:1.5,fontWeight:on?500:400}}>{opt.text}</span>
                </div>
              );
            })}
          </div>
        </div>
      </div>
    </div>
  );
}

            What do you<br/>want to <em style={{fontStyle:"italic",color:D.accent}}>say?</em>
          </h2>
          {arch&&<p style={{fontFamily:D.sans,fontSize:13,color:D.cream3}}>We'll filter it for you, {arch.label.toLowerCase()}.</p>}
        </div>
        <div style={{marginBottom:18}}>
          <p style={{fontFamily:D.sans,fontSize:10,color:D.cream3,textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:10}}>Situation</p>
          <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
            {CONTEXTS.map(c=>{
              const on=ctx.id===c.id;
              return <button key={c.id} onClick={()=>setCtx(c)}
                style={{padding:"8px 16px",background:on?D.accent:D.surface,border:`1px solid ${on?D.accent:D.border}`,borderRadius:20,fontFamily:D.sans,fontSize:13,fontWeight:on?500:400,color:on?"#fff":D.cream2,cursor:"pointer",transition:"all .18s"}}>
                {c.label}
              </button>;
            })}
          </div>
          <p style={{fontFamily:D.sans,fontSize:11,color:D.cream3,marginTop:6}}>{ctx.sub}</p>
        </div>
        <div style={{flex:1,display:"flex",flexDirection:"column",gap:12}}>
          <textarea value={raw} onChange={e=>setRaw(e.target.value.slice(0,MAX))}
            placeholder={"Just start typing, don't overthink it…\n\nI want to tell my manager the deadline isn't realistic but I don't want to seem difficult and maybe I'm wrong but Sarah also hasn't sent the files and…"}
            style={{flex:1,minHeight:180,background:D.surface,border:`1px solid ${D.border}`,borderRadius:16,padding:"18px 20px",fontFamily:D.sans,fontSize:15,color:D.cream,resize:"none",outline:"none",lineHeight:1.7,transition:"border-color .2s",scrollbarWidth:"none"}}
            onFocus={e=>e.target.style.borderColor=`${D.accent}80`}
            onBlur={e=>e.target.style.borderColor=D.border}
          />
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
            <div>
              <span style={{fontFamily:D.sans,fontSize:11,color:D.cream3}}>{raw.length}/{MAX}</span>
              {!isAdmin&&(
                <span style={{fontFamily:D.sans,fontSize:11,color:remaining<=1?"#E08080":D.cream3,marginLeft:10}}>
                  {remaining===0?"No filters left":`${remaining} filter${remaining!==1?"s":""} left${remaining===1?" — last one ⚠️":""}`}
                </span>
              )}
              {isAdmin&&<span style={{fontFamily:D.sans,fontSize:11,color:"#E8C97A",marginLeft:10}}>Admin mode</span>}
            </div>
            <PBtn onClick={handleFilter} disabled={!raw.trim()||(remaining===0&&!isAdmin)} style={{padding:"13px 24px",fontSize:14}}>
              Filter it →
            </PBtn>
          </div>
        </div>
      </div>
      <BetaBanner/>
    </div>
  );
}

function Output(){
  const {go,ctx,raw,result,setResult,loading,genError,generate,personality,showPaywall}=useApp();
  const arch=personality.completed?ARCHETYPES[personality.archetypeKey]:null;
  const isExit=result?.isExit||false;
  const [copiedIndex,setCopiedIndex]=useState(null);
  const [ratings,setRatings]=useState({0:0,1:0,2:0});
  const [hoveredStar,setHoveredStar]=useState({card:null,star:null});
  const [feedback,setFeedback]=useState({0:"",1:"",2:""});
  const [profanityWarning,setProfanityWarning]=useState({0:false,1:false,2:false});
  const [visible,setVisible]=useState([false,false,false]);

  const PROFANITY=["fuck","shit","cunt","bitch","asshole","bastard","dick","pussy","cock","twat","wanker","piss","arse","bollocks","damn","crap","motherfucker","fucker"];

  function containsProfanity(text){
    const words=text.toLowerCase().replace(/[^a-z\s]/g,"").split(/\s+/);
    return words.some(w=>PROFANITY.includes(w));
  }

  useEffect(()=>{
    if(!result?.variations)return;
    setRatings({0:0,1:0,2:0});
    setFeedback({0:"",1:"",2:""});
    setVisible([false,false,false]);
    const t0=setTimeout(()=>setVisible(v=>[true,v[1],v[2]]),100);
    const t1=setTimeout(()=>setVisible(v=>[v[0],true,v[2]]),300);
    const t2=setTimeout(()=>setVisible(v=>[v[0],v[1],true]),500);
    return()=>{clearTimeout(t0);clearTimeout(t1);clearTimeout(t2);};
  },[result]);

  const copy=async(text,index)=>{
    try{await navigator.clipboard.writeText(text);setCopiedIndex(index);setTimeout(()=>setCopiedIndex(null),2200);}catch(_){}
  };

  const handleFeedback=(index,value)=>{
    if(containsProfanity(value)){
      setProfanityWarning(p=>({...p,[index]:true}));
      setTimeout(()=>setProfanityWarning(p=>({...p,[index]:false})),3000);
    }
    setFeedback(f=>({...f,[index]:value}));
  };

  const variations=result?.variations||[];

  return(
    <div style={{display:"flex",flexDirection:"column",height:"100%",position:"relative"}}>
      {showPaywall&&<Paywall/>}
      <div style={{position:"relative",zIndex:2,display:"flex",alignItems:"center",justifyContent:"space-between",padding:"22px 24px 0",flexShrink:0}}>
        <button onClick={()=>go("main")} style={{background:"none",border:"none",fontFamily:D.sans,fontSize:13,color:D.cream2,cursor:"pointer",padding:0}}>← Edit</button>
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          {isExit&&<span style={{fontSize:11,color:D.exit,fontFamily:D.sans,fontWeight:500,background:`${D.exit}18`,border:`1px solid ${D.exit}40`,borderRadius:20,padding:"2px 10px"}}>Exit mode</span>}
          <span style={{fontFamily:D.sans,fontSize:11,color:D.cream3,textTransform:"uppercase",letterSpacing:"0.06em"}}>{ctx.label}</span>
        </div>
      </div>
      <div style={{flex:1,overflowY:"auto",padding:"16px 24px 36px",position:"relative",zIndex:1,scrollbarWidth:"none"}}>
        {loading&&(
          <div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",height:"70%",gap:16}}>
            <div style={{width:36,height:36,borderRadius:"50%",border:`2px solid ${D.border}`,borderTop:`2px solid ${D.accent}`,animation:"spin 1s linear infinite"}}/>
            <p style={{fontFamily:D.sans,fontSize:13,color:D.cream3}}>Filtering your thought…</p>
          </div>
        )}
        {!loading&&genError&&(
          <div style={{padding:24,background:D.surface,borderRadius:16,border:`1px solid ${D.border}`,marginTop:20,textAlign:"center"}}>
            <p style={{fontFamily:D.sans,fontSize:14,color:D.cream2,lineHeight:1.6,marginBottom:16}}>{genError}</p>
            <GBtn onClick={()=>generate(raw,ctx,personality)}>Try again</GBtn>
          </div>
        )}
        {!loading&&!genError&&result&&(
          <div>
            <h2 style={{fontFamily:D.serif,fontSize:26,fontWeight:300,color:D.cream,lineHeight:1.25,letterSpacing:"-0.01em",marginBottom:20}}>
              {isExit?"Here's your escape plan.":<>Here's what to <em style={{fontStyle:"italic",color:D.accent}}>say.</em></>}
            </h2>
            <div style={{display:"flex",flexDirection:"column",gap:12}}>
              {variations.slice(0,3).map((v,i)=>(
                <div key={i} style={{opacity:visible[i]?1:0,transform:visible[i]?"translateY(0)":"translateY(12px)",transition:"opacity 0.4s ease, transform 0.4s ease"}}>
                  <div style={{background:isExit?D.exitLight:`linear-gradient(135deg,${D.surface} 0%,${D.surf2} 100%)`,border:`1px solid ${isExit?D.exit+"40":D.accent+"40"}`,borderRadius:16,padding:"16px 18px"}}>
                    <p style={{fontFamily:D.sans,fontSize:10,color:isExit?D.exit:D.cream3,textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:10}}>
                      {isExit?"Exit line":"Filtered version"}
                    </p>
                    <p style={{fontFamily:D.sans,fontSize:15,color:D.cream,lineHeight:1.8,marginBottom:12,whiteSpace:"pre-wrap"}}>{v.refined}</p>
                    {v.explanation&&<p style={{fontFamily:D.sans,fontSize:12,color:D.cream3,lineHeight:1.6,marginBottom:14,fontStyle:"italic"}}>✦ {v.explanation}</p>}
                    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10}}>
                      <div style={{display:"flex",gap:4}}>
                        {[1,2,3,4,5].map(s=>(
                          <span key={s}
                            onMouseEnter={()=>setHoveredStar({card:i,star:s})}
                            onMouseLeave={()=>setHoveredStar({card:null,star:null})}
                            onClick={()=>setRatings(r=>({...r,[i]:s}))}
                            style={{fontSize:18,cursor:"pointer",color:(hoveredStar.card===i&&s<=hoveredStar.star)||s<=ratings[i]?"#E8C97A":D.cream3,transition:"color 0.15s"}}>
                            {(hoveredStar.card===i&&s<=hoveredStar.star)||s<=ratings[i]?"★":"☆"}
                          </span>
                        ))}
                      </div>
                      <button onClick={()=>copy(v.refined,i)}
                        style={{background:isExit?D.exit:D.accent,color:"#fff",border:"1px solid rgba(255,255,255,0.15)",borderRadius:8,padding:"6px 16px",fontFamily:D.sans,fontSize:12,fontWeight:500,cursor:"pointer"}}>
                        {copiedIndex===i?"Copied ✓":"Copy"}
                      </button>
                    </div>
                    <input
                      type="text"
                      value={feedback[i]}
                      onChange={e=>handleFeedback(i,e.target.value)}
                      placeholder="Anything to add? (optional)"
                      style={{width:"100%",background:D.bg2,border:`1px solid ${D.border2}`,borderRadius:8,padding:"8px 12px",fontFamily:D.sans,fontSize:12,color:D.cream2,outline:"none"}}
                    />
                    {profanityWarning[i]&&<p style={{fontFamily:D.sans,fontSize:11,color:D.cream3,marginTop:5}}>Keep it clean 🙂</p>}
                  </div>
                </div>
              ))}
            </div>
            <div style={{textAlign:"center",marginTop:16}}>
              <button onClick={()=>go("main")} style={{background:"none",border:"none",fontFamily:D.sans,fontSize:13,color:D.cream3,cursor:"pointer"}}>
                Start over
              </button>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

function Shell(){
  const {screen}=useApp();
  const map={gate:<AgeGate/>,tos:<ToSScreen/>,splash:<Splash/>,quiz:<Quiz/>,reveal:<Reveal/>,welcome:<WelcomeGate/>,main:<Main/>,output:<Output/>};
  return(
    <div style={{width:"100%",height:"100%",background:D.bg,position:"relative",overflow:"hidden"}}>
      <style>{`
        @keyframes spin{to{transform:rotate(360deg)}}
        @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
        *{box-sizing:border-box;}
        textarea,input{scrollbar-width:none;}
        textarea::placeholder{color:#5C5955;font-style:italic;}
        input::placeholder{color:#5C5955;}
        ::-webkit-scrollbar{display:none;}
        button{-webkit-tap-highlight-color:transparent;}
      `}</style>
      {Object.entries(map).map(([k,el])=>(
        <div key={k} style={{position:"absolute",inset:0,opacity:screen===k?1:0,transform:screen===k?"translateY(0)":"translateY(14px)",transition:"opacity .35s ease,transform .35s ease",pointerEvents:screen===k?"all":"none",overflow:"hidden"}}>
          {el}
        </div>
      ))}
    </div>
  );
}

function App(){
  const isMobile=window.innerWidth<=500;
  if(isMobile){
    return <div style={{height:"100vh",width:"100vw",background:D.bg}}><AppProvider><Shell/></AppProvider></div>;
  }
  return(
    <div style={{minHeight:"100vh",background:"#0D0E11",display:"flex",alignItems:"center",justifyContent:"center",padding:"20px"}}>
      <div style={{width:400,height:"min(820px,92vh)",background:D.bg,borderRadius:36,overflow:"hidden",boxShadow:"0 32px 80px rgba(0,0,0,0.6),0 0 0 1px rgba(255,255,255,0.06)",position:"relative"}}>
        <AppProvider><Shell/></AppProvider>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
